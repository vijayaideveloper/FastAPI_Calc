
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastAPI Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .main_module {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form_group {
            margin-bottom: 20px;
        }

        .form_group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form_group input,
        .form_group select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #fafafa;
        }

        .form_group input:focus,
        .form_group select:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f5f7ff;
            border-left: 5px solid #667eea;
        }

        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .result p {
            color: #555;
            margin: 8px 0;
            font-size: 15px;
        }

        .result strong {
            color: #333;
        }

        .result_value {
            margin-top: 15px;
            padding: 12px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .main_module {
                padding: 25px;
            }

            .header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="main_module">

        <div class="header">
            <h2>🧮 FastAPI Calculator</h2>
            <p>Perform simple mathematical operations</p>
        </div>

        <form action="/calc" method="post">

            <div class="form_group">
                <label for="a">Enter Number A</label>
                <input
                    id="a"
                    name="a"
                    type="number"
                    step="any"
                    placeholder="Enter first number"
                    required
                >
            </div>

            <div class="form_group">
                <label for="b">Enter Number B</label>
                <input
                    id="b"
                    name="b"
                    type="number"
                    step="any"
                    placeholder="Enter second number"
                    required
                >
            </div>

            <div class="form_group">
                <label for="choice">Select Operation</label>

                <select id="choice" name="choice" required>
                    <option value="" disabled selected>
                        Choose operation
                    </option>
                    <option value="add">Addition (+)</option>
                    <option value="sub">Subtraction (-)</option>
                    <option value="mul">Multiplication (×)</option>
                    <option value="div">Division (÷)</option>
                </select>
            </div>

            <button type="submit">
                Calculate
            </button>

        </form>

        {% if message == "ok" %}

        <div class="result">

            <h3>📊 Calculation Result</h3>

            <p>
                <strong>Value A:</strong> {{ a }}
            </p>

            <p>
                <strong>Value B:</strong> {{ b }}
            </p>

            <p>
                <strong>Operation:</strong> {{ choice }}
            </p>

            <div class="result_value">
                Result: {{ result }}
            </div>

        </div>

        {% endif %}

        <div class="footer">
            Built with FastAPI + Jinja2
        </div>

    </div>
    <script>
        
    </script>
</body>
</html>
